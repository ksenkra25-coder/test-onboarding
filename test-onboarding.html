<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тест: IT или творчество?</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #2b2f33; /* тёмный приятный фон */
      color: #1e2a3a;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: #f5f7fa; /* светлое поле */
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      max-width: 700px;
      width: 100%;
      padding: 30px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 8px;
      color: #1e2a3a;
      letter-spacing: 0.5px;
    }

    .subtitle {
      font-size: 16px;
      color: #5a6b7b;
      margin-bottom: 30px;
      font-style: italic;
    }

    .question {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 20px;
      color: #1e2a3a;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 30px;
    }

    .option-btn {
      text-align: left;
      padding: 16px 20px;
      border: 2px solid #86b96c; /* мягкий зелёный */
      border-radius: 16px;
      background: #ffffff;
      cursor: pointer;
      font-size: 17px;
      transition: all 0.2s ease;
      font-weight: 500;
      color: #1e2a3a;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .option-btn:hover {
      border-color: #6aa84f;
      background: #f0f9ec;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    .option-btn.selected {
      border-color: #4e8c3a;
      background: #e5f4dd;
      box-shadow: 0 0 0 2px rgba(110,168,79,0.3);
    }

    .nav-buttons {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .btn {
      padding: 12px 24px;
      border: 2px solid #86b96c;
      border-radius: 12px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      transition: 0.2s;
      background: #ffffff;
      color: #1e2a3a;
      letter-spacing: 0.3px;
    }

    .btn-secondary {
      background: #f0f2f5;
      border-color: #c5cdd6;
      color: #4a5a6a;
    }

    .btn-primary {
      background: #86b96c;
      border-color: #6aa84f;
      color: #ffffff;
    }

    .btn-primary:hover {
      background: #6aa84f;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .result-box {
      display: none;
      background: #eaf3e5;
      border-radius: 20px;
      padding: 25px;
      margin-top: 25px;
      font-size: 18px;
      line-height: 1.5;
      border: 2px solid #86b96c;
      color: #1e2a3a;
    }

    .result-box.show {
      display: block;
    }

    .progress {
      font-size: 14px;
      color: #6aa84f;
      margin-bottom: 15px;
      font-weight: 600;
    }

    @media (max-width: 600px) {
      .container {
        padding: 20px;
      }
      h1 {
        font-size: 24px;
      }
      .question {
        font-size: 18px;
      }
      .option-btn {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🕹️ Какой модуль открыть первым?</h1>
    <p class="subtitle">Давай разберёмся, какой модуль нам стоит открыть первым для тебя? Выбери тот вариант, который откликается первым. Здесь нет правильных и неправильных ответов.</p>
    <div class="progress" id="progress"></div>
    <div id="question" class="question"></div>
    <div id="options" class="options"></div>
    <div class="nav-buttons">
      <button id="backBtn" class="btn btn-secondary" onclick="prevQuestion()">← Назад</button>
      <button id="nextBtn" class="btn btn-primary" onclick="nextQuestion()">Далее →</button>
    </div>
    <div id="result" class="result-box"></div>
  </div>

  <script>
    const questions = [
      {
        question: "Представь, что у тебя есть целый день, который ты можешь провести с компьютером и никто не будет тебя отвлекать. Что бы тебе хотелось делать больше?",
        options: [
          { text: "Собрать свою настоящую игру: гоночки, стрелялки с зомби, квизы", type: "A" },
          { text: "Нарисовать персонажа из игры или смонтировать видео в тик-ток", type: "B" }
        ]
      },
      {
        question: "Что для тебя интереснее из этих двух действий?",
        options: [
          { text: "Понять, как устроена игра изнутри, почему она работает", type: "A" },
          { text: "Придумать, как игра должна выглядеть, какие там герои и цвета", type: "B" }
        ]
      },
      {
        question: "Если у тебя что-то не получается, что ты делаешь?",
        options: [
          { text: "Пробую ещё раз, ищу другой способ, разбираюсь в логике", type: "A" },
          { text: "Меняю подход, пробую сделать по-другому, добавляю что-то своё", type: "B" }
        ]
      },
      {
        question: "Если бы тебе пришлось разрабатывать игру, какую задачу тебе было бы интереснее решать?",
        options: [
          { text: "Сделать так, чтобы персонаж двигался и собирал предметы", type: "A" },
          { text: "Нарисовать этого персонажа и придумать ему историю", type: "B" }
        ]
      },
      {
        question: "Что тебе больше нравится в играх?",
        options: [
          { text: "Проходить сложные уровни, искать закономерности, побеждать", type: "A" },
          { text: "Смотреть на красивые локации, слушать музыку, создавать визуал", type: "B" }
        ]
      },
      {
        question: "Если бы тебе пришлось делать проект для школьной конференции, что бы ты выбрал(а)?",
        options: [
          { text: "Сделать интерактивную игру или приложение, которое можно протестировать на телефоне", type: "A" },
          { text: "Сделать мультфильм или видеоролик", type: "B" }
        ]
      },
      {
        question: "Какая фраза тебе ближе?",
        options: [
          { text: "«Я хочу, чтобы это работало!»", type: "A" },
          { text: "«Я хочу, чтобы это выглядело круто!»", type: "B" }
        ]
      }
    ];

    let currentQuestion = 0;
    let answers = new Array(questions.length).fill(null);
    let countA = 0;
    let countB = 0;

    const questionEl = document.getElementById('question');
    const optionsEl = document.getElementById('options');
    const progressEl = document.getElementById('progress');
    const backBtn = document.getElementById('backBtn');
    const nextBtn = document.getElementById('nextBtn');
    const resultBox = document.getElementById('result');

    function renderQuestion() {
      const q = questions[currentQuestion];
      questionEl.textContent = q.question;
      optionsEl.innerHTML = '';
      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = opt.text;
        if (answers[currentQuestion] === idx) {
          btn.classList.add('selected');
        }
        btn.addEventListener('click', () => selectOption(idx));
        optionsEl.appendChild(btn);
      });

      progressEl.textContent = `Вопрос ${currentQuestion + 1} из ${questions.length}`;
      backBtn.disabled = currentQuestion === 0;
      nextBtn.disabled = answers[currentQuestion] === null;

      if (currentQuestion === questions.length - 1) {
        nextBtn.textContent = 'Показать результат';
      } else {
        nextBtn.textContent = 'Далее →';
      }
    }

    function selectOption(idx) {
      answers[currentQuestion] = idx;
      const allBtns = optionsEl.querySelectorAll('.option-btn');
      allBtns.forEach((btn, i) => {
        if (i === idx) btn.classList.add('selected');
        else btn.classList.remove('selected');
      });
      nextBtn.disabled = false;
    }

    function nextQuestion() {
      if (currentQuestion < questions.length - 1) {
        currentQuestion++;
        renderQuestion();
      } else {
        showResult();
      }
    }

    function prevQuestion() {
      if (currentQuestion > 0) {
        currentQuestion--;
        renderQuestion();
      }
    }

    function showResult() {
      countA = 0;
      countB = 0;
      answers.forEach((ansIdx, qIdx) => {
        if (ansIdx !== null) {
          const type = questions[qIdx].options[ansIdx].type;
          if (type === 'A') countA++;
          else if (type === 'B') countB++;
        }
      });

      let resultText = '';
      if (countA > countB) {
        resultText = '💻 Тебе ближе <b>IT и программирование</b>. Видно, что тебе по душе логика и структура. Стоит начать со Kodu или Scratch, затем перейти к Construct 3, а после к Python и Roblox, либо попробовать другие более творческие модули для разнообразия и расширения навыков.';
      } else if (countB > countA) {
        resultText = '🎨 Тебе ближе <b>цифровое творчество и дизайн</b>. Видно, что тебе по душе визуал, образы, истории. Тебе стоит начать с Pixelart, мультипликации, MagicaVoxel или видеомонтажа. Также стоит попробовать Scratch или Kodu, чтобы понять, как оживают твои персонажи.';
      } else {
        resultText = '✨ У тебя <b>смешанный тип</b>, тебе интересно и то и другое. И это отлично! Можно пробовать следующие модули по очереди: мультипликация, Pixelart, Kodu, Scratch, MagicaVoxel.';
      }

      resultBox.innerHTML = resultText;
      resultBox.classList.add('show');
      questionEl.style.display = 'none';
      optionsEl.style.display = 'none';
      backBtn.style.display = 'none';
      nextBtn.style.display = 'none';
      progressEl.style.display = 'none';
    }

    renderQuestion();
  </script>
</body>
</html>
